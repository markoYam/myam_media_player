name: video_downloader
description: "Video Downloader: buscar, ver, escuchar en segundo plano y descargar videos de YouTube. Android e iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # YouTube sin API key (BSD-3). Se rompe cuando YouTube cambia: actualizar a la última versión.
  youtube_explode_dart: ^3.1.0
  http: ^1.2.0

  # Estado
  flutter_riverpod: ^3.0.0

  # Reproducción: audio en segundo plano (notificación, pantalla de bloqueo) y video
  just_audio: ^0.10.0
  just_audio_background: ^0.0.1-beta.17
  video_player: ^2.9.0

  # Persistencia y archivos
  sqflite: ^2.4.0
  shared_preferences: ^2.3.0
  # Mixtape: guardar solo con Wi-Fi
  connectivity_plus: '>=6.0.1 <8.0.0'
  path_provider: ^2.1.4
  path: ^1.9.0

  # Unir video+audio (MP4 HD) y convertir a MP3 con LAME: plugin propio en packages/
  media_tools:
    path: packages/media_tools

  # UI
  cached_network_image: '>=3.4.1 <5.0.0'
  share_plus: '>=11.0.0 <14.0.0'
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
